name: CARDINAL CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - name: Production-like frontend build
        env:
          VITE_BACKEND_URL: ${{ vars.GCP_BACKEND_URL || 'https://backend.example.invalid' }}
          VITE_API_BASE_URL: ${{ vars.GCP_BACKEND_URL || 'https://backend.example.invalid' }}
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m compileall -q backend/app backend/main.py
      - run: python backend/scripts/verify_terraform_cicd_v2.py --project-root .

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.14.6'
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/bootstrap init -backend=false
      - run: terraform -chdir=infra/bootstrap validate
      - run: terraform -chdir=infra/app init -backend=false
      - run: terraform -chdir=infra/app validate
