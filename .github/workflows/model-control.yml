name: CARDINAL Gemma Control

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Gemma operation"
        required: true
        type: choice
        options:
          - ON
          - OFF
          - STATUS

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
  REGION: ${{ vars.GCP_REGION }}
  WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
  MODEL_SERVICE: cardinal-gemma4-26b-a4b-it
  DEPLOY_SA: github-cardinal-deployer@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: ON - cold autoscaling 0 to 1
        if: ${{ inputs.operation == 'ON' }}
        shell: bash
        run: |
          START_EPOCH="$(date +%s)"
          echo "Gemma will be WAKEABLE but has min=0; no permanently warm instance is reserved."
          gcloud run services update "$MODEL_SERVICE" \
            --project="$PROJECT_ID" --region="$REGION" \
            --scaling=auto --min=0 --max=1 \
            --update-labels="cardinal-demo-start-epoch=${START_EPOCH}" \
            --quiet

      - name: OFF - fully disabled
        if: ${{ inputs.operation == 'OFF' }}
        run: |
          gcloud run services update "$MODEL_SERVICE" \
            --project="$PROJECT_ID" --region="$REGION" \
            --scaling=0 --quiet

      - name: Status
        run: |
          gcloud run services describe "$MODEL_SERVICE" \
            --project="$PROJECT_ID" --region="$REGION" \
            --format='yaml(status.url,scaling,template.scaling,template.containers.resources)'
