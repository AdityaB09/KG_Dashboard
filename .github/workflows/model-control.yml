name: CARDINAL Gemma Control

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'CPU Gemma 26B operation'
        required: true
        type: choice
        options: [ON, OFF, STATUS]

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
  REGION: ${{ vars.GCP_REGION }}
  WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
  MODEL_SERVICE: cardinal-gemma4-26b-a4b-it
  MODEL_URL: https://cardinal-gemma4-26b-a4b-it-${{ vars.GCP_PROJECT_NUMBER }}.${{ vars.GCP_REGION }}.run.app
  DEPLOY_SA: github-cardinal-deployer@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

jobs:
  control:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Validate required repository variables
        run: |
          test -n "$PROJECT_ID" || (echo 'Missing GCP_PROJECT_ID repository variable' && exit 1)
          test -n "$PROJECT_NUMBER" || (echo 'Missing GCP_PROJECT_NUMBER repository variable' && exit 1)
          test -n "$REGION" || (echo 'Missing GCP_REGION repository variable' && exit 1)
          test -n "$WIF_PROVIDER" || (echo 'Missing GCP_WIF_PROVIDER repository variable' && exit 1)
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: ON
        if: ${{ inputs.operation == 'ON' }}
        run: |
          echo 'WARNING: enabling one 8-vCPU Gemma 26B instance; GPU billing begins.'
          gcloud run services update "$MODEL_SERVICE" --project="$PROJECT_ID" --region="$REGION" --scaling=1
      - name: OFF
        if: ${{ inputs.operation == 'OFF' }}
        run: gcloud run services update "$MODEL_SERVICE" --project="$PROJECT_ID" --region="$REGION" --scaling=0
      - name: Status
        run: gcloud run services describe "$MODEL_SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='yaml(status.url,scaling,template.nodeSelector,template.containers.resources)'
